<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phyzzy — энциклопедия физики </title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/article.css">
    <link rel="stylesheet" href="css/blocks.css">
    <link rel="stylesheet" href="css/tasks.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- Шапка (всегда видна) -->
<header id="appHeader"></header>

<!-- Главный экран — энциклопедия -->
<main class="hero" id="hero"></main>

<!-- Результаты поиска -->
<section class="results hidden" id="results"></section>

<!-- Статья -->
<article class="article hidden" id="article"></article>

<!-- Вкладка «Задачи» — список -->
<section class="tasks hidden" id="tasks"></section>

<!-- Просмотр одной задачи -->
<section class="task-view hidden" id="taskView"></section>

<script type="module" src="js/main.js"></script>
</body>
</html>
